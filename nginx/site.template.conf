# ============================================================
# mTLS 加固站点 — 端口 __EXPOSE_PORT__ → 127.0.0.1:__PROXY_PORT__
# 自动生成，请勿手动修改
# ============================================================

# 证书校验结果映射
map $ssl_client_verify $mtls_ok {
    "SUCCESS"  1;
    default    0;
}

server {
    listen __EXPOSE_PORT__ ssl reuseport;
    http2 on;

    # ========== 全局连接限制 ==========
    limit_conn connlimit 20;

    # ========== TLS 加固 ==========
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:secp384r1;
    ssl_session_cache shared:SSL___EXPOSE_PORT__:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # ========== 服务器证书 ==========
    ssl_certificate     /etc/nginx/certs/servers/__EXPOSE_PORT__/server.crt;
    ssl_certificate_key /etc/nginx/certs/servers/__EXPOSE_PORT__/server.key;

    # ========== mTLS 核心 ==========
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client      optional;
    ssl_verify_depth       2;

    # ========== CRL 吊销列表 ==========
    ssl_crl /etc/nginx/certs/ca.crl;

    # ========== HSTS ==========
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ========== 安全头 ==========
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # ============================================================
    # 受保护站点
    # ============================================================
    location / {
        if ($mtls_ok = 0) {
            return 302 /install/;
        }

        proxy_pass http://127.0.0.1:__PROXY_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Verify $ssl_client_verify;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # ============================================================
    # 证书安装引导页 — 免证书 + 严格限速
    # ============================================================
    location /install/ {
        alias /var/www/install/;
        index index.html;
        try_files $uri $uri/ =404;

        # 严格限速：单 IP 每分钟 10 次请求，burst 3
        limit_req zone=install burst=3 nodelay;
        limit_req_status 429;

        # 禁止缓存
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 证书文件下载
    location /install/certs/ {
        alias /etc/nginx/certs/clients/;
        add_header Content-Disposition 'attachment';
        add_header Cache-Control "private, no-cache";
        autoindex off;
        try_files $uri =404;
    }

    # ============================================================
    # 健康检查（免证书免限速）
    # ============================================================
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}