user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    # mTLS 专用日志格式
    log_format mtls '$remote_addr [$time_local] "$request" $status '
                    'cert_verify="$ssl_client_verify" '
                    'cert_serial="$ssl_client_serial" '
                    'cert_dn="$ssl_client_s_dn"';

    access_log /var/log/nginx/access.log main;

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # 安全：隐藏版本
    server_tokens off;

    # ================================================================
    # 限速区域定义（全局共享）
    # ================================================================

    # /install/ 页面访问限速：单 IP 10次/分钟
    limit_req_zone $binary_remote_addr zone=install:10m rate=10r/m;

    # API/登录爆破限速：单 IP 5次/分钟
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # 全局连接限速：单 IP 20 conn/s
    limit_conn_zone $binary_remote_addr zone=connlimit:10m;

    # ================================================================
    # 黑名单（由 fail2ban 自动维护）
    # ================================================================
    map $remote_addr $is_banned {
        default 0;
        include /var/log/nginx/ban/blacklist.conf;
    }

    include /etc/nginx/conf.d/*.conf;
}