# fail2ban filter: nginx-mtls
# 匹配 mTLS 证书校验失败 + 暴力尝试

[Definition]

failregex = ^.*client SSL certificate verify error.*while reading client request headers.*client: <HOST>.*$
            ^.*client sent no required SSL certificate while reading client request headers.*client: <HOST>.*$
            ^.*SSL_read\(\) failed.*peer did not return a certificate.*client: <HOST>.*$
            ^.*client SSL certificate verify error.*client: <HOST>

ignoreregex =